<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sizzle Panic! — a rush-hour cooking game</title>
  <style>
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; }
    body { display: grid; place-items: center; background: #100f16; color: #fff0d6; font-family: system-ui, sans-serif; }
    canvas { display: block; width: min(100vw, 160vh); height: auto; aspect-ratio: 8 / 5; touch-action: none; }
    noscript { position: absolute; padding: 1rem; background: #100f16; }
  </style>
</head>
<body>
  <canvas id="game" width="1280" height="800" aria-label="Sizzle Panic! cooking game"></canvas>
  <noscript>Please enable JavaScript to play Sizzle Panic!</noscript>
  <script type="module" src="./src/main.js"></script>
</body>
</html>
